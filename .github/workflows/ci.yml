name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-editorial.txt ruff

      # Critical errors only (syntax, undefined names); the style backlog is tracked separately.
      - name: Lint
        run: ruff check . --select E9,F63,F7,F82

      - name: Check UI modules parse
        run: |
          for file in ui/minimal/*.js; do node --input-type=module --check < "$file"; done

      - name: Tests
        run: python -m pytest -q
