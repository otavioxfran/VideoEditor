[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-editor"
version = "1.1.0"
description = "Local rough-cut editor for talking-head videos: removes silences, stumbles and repeated takes, leaves doubtful cuts for review"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "otavioxfran" }
]
dependencies = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.1",
    "pydantic==2.13.4",
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "numpy==2.4.6",
    "opencv-python-headless>=4.8",
]

[project.urls]
Homepage = "https://github.com/otavioxfran/VideoEditor"
Issues = "https://github.com/otavioxfran/VideoEditor/issues"
Changelog = "https://github.com/otavioxfran/VideoEditor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[project.scripts]
video-editor = "cli:main"

[tool.setuptools.packages.find]
include = ["video_editor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
]
ignore = [
    "E501",
]
